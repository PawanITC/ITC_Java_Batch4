services:


  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: linkedin-keycloak
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: linkedin
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json

  redis:
    image: redis:7
    container_name: linkedin-redis
    ports:
      - "6379:6379"

  postgres-search:
    image: postgres:16
    container_name: linkedin-search-postgres
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: searchdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - search_postgres_data:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: linkedin-opensearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
  kafka:
    image: apache/kafka:3.9.0
    container_name: linkedin-kafka
    ports:
      - "9099:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: linkedin-schema-registry
    ports:
      - "8081:8081"
    depends_on:
      - kafka
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: [ "--config=/etc/otelcol/otel-collector-config.yml" ]
    volumes:
      - ./observability/opentelemetry/otel-collector-config.yml:/etc/otelcol/otel-collector-config.yml:ro
    ports:
      - "4319:4317"
      - "4320:4318"
    depends_on:
      - jaeger

  prometheus:
    build: ./observability/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  search-discovery-service:
    build: ./backend/searchAndDiscover
    container_name: linkedin-search-discovery-service
    restart: on-failure
    ports:
      - "8086:8086"
    depends_on:
      - postgres-search
      - opensearch
      - keycloak
      - redis
      - otel-collector
    volumes:
      - ./observability/opentelemetry/opentelemetry-javaagent.jar:/opentelemetry/opentelemetry-javaagent.jar
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/opentelemetry/opentelemetry-javaagent.jar -Dotel.service.name=search-discovery-service -Dotel.traces.exporter=otlp -Dotel.exporter.otlp.endpoint=http://otel-collector:4318 -Dotel.metrics.exporter=none"
      POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://postgres-search:5432/searchdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      ELASTICSEARCH_URI: ${ELASTICSEARCH_URI:-http://opensearch:9200}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/linkedin-app
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/linkedin-app/protocol/openid-connect/certs
      SWAGGER_OAUTH_CLIENT_ID: ${SWAGGER_OAUTH_CLIENT_ID:-linkedin-frontend}
      SWAGGER_OAUTH_REDIRECT_URL: ${SEARCH_SWAGGER_OAUTH_REDIRECT_URL:-http://localhost:8086/swagger-ui/oauth2-redirect.html}

  api-gateway:
    build: ./backend/api-gateway
    container_name: linkedin-api-gateway
    ports:
      - "8085:8085"
    depends_on:
      - keycloak
      - redis
      - search-discovery-service
      - userprofile-service
      - feed-and-timeline-service
      - post-service
      - connections-service
      - notification-service
      - otel-collector
      - jobposting-service
    volumes:
      - ./observability/opentelemetry/opentelemetry-javaagent.jar:/opentelemetry/opentelemetry-javaagent.jar
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/opentelemetry/opentelemetry-javaagent.jar -Dotel.service.name=api-gateway -Dotel.traces.exporter=otlp -Dotel.exporter.otlp.endpoint=http://otel-collector:4318 -Dotel.metrics.exporter=none"
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/linkedin-app
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/linkedin-app/protocol/openid-connect/certs
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      USERPROFILE_SERVICE_URI: http://userprofile-service:8083
      SEARCH_SERVICE_URI: http://search-discovery-service:8086
      FEED_SERVICE_URI: http://feed-and-timeline-service:8087
      POST_SERVICE_URI: http://post-service:8088
      CONNECTIONS_SERVICE_URI: http://connections-service:8082
      NOTIFICATION_SERVICE_URI: http://notification-service:8091

  userprofile-postgres:
    image: postgres:16
    container_name: linkedin-userprofile-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: userprofile
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hasnain4890
    volumes:
      - userprofile_postgres_data:/var/lib/postgresql/data


  userprofile-service:
    build: ./backend/userprofile
    container_name: linkedin-userprofile-service
    ports:
      - "8083:8083"
    depends_on:
      - userprofile-postgres
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://userprofile-postgres:5432/userprofile
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: hasnain4890
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/linkedin-app
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/linkedin-app/protocol/openid-connect/certs


  jobposting-postgres:
    image: postgres:16
    container_name: linkedin-jobposting-postgres
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hasnain4890
    volumes:
      - jobposting_postgres_data:/var/lib/postgresql/data


  jobposting-service:
    build: ./backend/jobPosting
    container_name: linkedin-jobposting-service
    ports:
      - "8089:8089"
    depends_on:
      - jobposting-postgres
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://jobposting-postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: hasnain4890
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/linkedin-app
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/linkedin-app/protocol/openid-connect/certs

  connections-postgres:
    image: postgres:16
    container_name: linkedin-connections-postgres
    ports:
      - "5439:5432"
    environment:
      POSTGRES_DB: connection_db
      POSTGRES_USER: connection_user
      POSTGRES_PASSWORD: connection_pass
    volumes:
      - connections_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connection_user -d connection_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  connections-service:
    build: ./backend/connections-service
    container_name: linkedin-connections-service
    ports:
      - "8082:8082"
    depends_on:
      connections-postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://connections-postgres:5432/connection_db
      SPRING_DATASOURCE_USERNAME: connection_user
      SPRING_DATASOURCE_PASSWORD: connection_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/linkedin-app
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/linkedin-app/protocol/openid-connect/certs

  postgres-feed:
    image: postgres:16
    container_name: linkedin-feed-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: feeddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - feed_postgres_data:/var/lib/postgresql/data

  post-postgres:
    image: postgres:16
    container_name: linkedin-post-postgres
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: postdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - post_postgres_data:/var/lib/postgresql/data

  notification-postgres:
    image: postgres:16
    container_name: linkedin-notification-postgres
    ports:
      - "5440:5432"
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data

  feed-and-timeline-service:
    build: ./backend/feedAndTimeline
    container_name: linkedin-feed-and-timeline-service
    ports:
      - "8087:8087"
    depends_on:
      - postgres-feed
      - otel-collector
      - redis
      - kafka
      - schema-registry
    volumes:
      - ./observability/opentelemetry/opentelemetry-javaagent.jar:/opentelemetry/opentelemetry-javaagent.jar
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/opentelemetry/opentelemetry-javaagent.jar -Dotel.service.name=feed-and-timeline-service -Dotel.traces.exporter=otlp -Dotel.exporter.otlp.endpoint=http://otel-collector:4318 -Dotel.metrics.exporter=none"
      POSTGRES_URL: jdbc:postgresql://postgres-feed:5432/feeddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SWAGGER_OAUTH_CLIENT_ID: linkedin-frontend
      SWAGGER_OAUTH_REDIRECT_URL: http://localhost:8087/swagger-ui/oauth2-redirect.html
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/linkedin-app
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/linkedin-app/protocol/openid-connect/certs

  post-service:
    build: ./backend/postAndTimeline
    container_name: linkedin-post-service
    ports:
      - "8088:8088"
    depends_on:
      - post-postgres
      - kafka
      - schema-registry
      - keycloak
      - otel-collector
    volumes:
      - ./observability/opentelemetry/opentelemetry-javaagent.jar:/opentelemetry/opentelemetry-javaagent.jar
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/opentelemetry/opentelemetry-javaagent.jar -Dotel.service.name=post-service -Dotel.traces.exporter=otlp -Dotel.exporter.otlp.endpoint=http://otel-collector:4318 -Dotel.metrics.exporter=none"
      POSTGRES_URL: jdbc:postgresql://post-postgres:5432/postdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/linkedin-app
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/linkedin-app/protocol/openid-connect/certs

  notification-service:
    build: ./backend/notification
    container_name: linkedin-notification-service
    ports:
      - "8091:8091"
    depends_on:
      - notification-postgres
      - kafka
    environment:
      SERVER_PORT: 8091
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-postgres:5432/notificationdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    ports:
      - "9308:9308"
    depends_on:
      - kafka
    command:
      - --kafka.server=kafka:9092



  client:
    build:
      context: ./frontend
      args:
        REACT_APP_API_BASE_URL: http://localhost:8085
        REACT_APP_KEYCLOAK_URL: http://localhost:8080
        REACT_APP_KEYCLOAK_REALM: linkedin-app
        REACT_APP_KEYCLOAK_CLIENT_ID: linkedin-frontend
        REACT_APP_LOGOUT_REDIRECT_URI: http://localhost:3000/login
    container_name: linkedin-frontend
    ports:
      - "3000:3000"

    depends_on:
      - keycloak
      - api-gateway
    environment:
      - PORT=3000
      - CHOKIDAR_USEPOLLING=true

volumes:
  feed_postgres_data:
  search_postgres_data:
  userprofile_postgres_data:
  post_postgres_data:
  jobposting_postgres_data:
  connections_postgres_data:
  notification_postgres_data:






