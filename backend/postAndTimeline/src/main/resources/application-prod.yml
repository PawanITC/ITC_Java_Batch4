spring:
  jpa:
    show-sql: false

  datasource:
    hikari:
      maximum-pool-size: ${POSTGRES_POOL_MAX_SIZE:2}
      minimum-idle: ${POSTGRES_POOL_MIN_IDLE:0}
      connection-timeout: ${POSTGRES_POOL_CONNECTION_TIMEOUT:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
