server:
  port: 8086

spring:
  application:
    name: search-discovery-service

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  elasticsearch:
    uris: ${ELASTICSEARCH_URI}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  spring:
    security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: http://localhost:8080/realms/linkedin-app
            jwk-set-uri: http://keycloak:8080/realms/linkedin-app/protocol/openid-connect/certs

management:
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include: health,info,metrics