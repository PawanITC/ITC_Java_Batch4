services:
  postgres:
    image: postgres:16
    container_name: connection-postgres
    environment:
      POSTGRES_DB: connection_db
      POSTGRES_USER: connection_user
      POSTGRES_PASSWORD: connection_pass
    ports:
      - "5432:5432"
    volumes:
      - connection_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: connection-redis
    ports:
      - "6379:6379"
  kafka:
    image: bitnami/kafka:3.7
    container_name: connection-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@connection-kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"

volumes:
  connection_postgres_data: