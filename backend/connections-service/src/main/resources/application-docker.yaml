server:
  port: 8082

spring:
  application:
    name: connections-service

  datasource:
    url: jdbc:postgresql://postgres:5432/connection_db
    username: connection_user
    password: connection_pass
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: redis
      port: 6379
      timeout: 2s

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: kafka:29092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.linkedinclone.connection: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

connection-service:
  kafka:
    topics:
      connection-request-sent: connection.request.sent
      connection-request-accepted: connection.request.accepted
      connection-request-rejected: connection.request.rejected
      connection-request-cancelled: connection.request.cancelled
      user-blocked: connection.user.blocked
      user-unblocked: connection.user.unblocked

  outbox:
    publisher-delay-ms: 5000