server:
  port: 8082

spring:
  application:
    name: connections-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/linkedin-app}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/linkedin-app/protocol/openid-connect/certs}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5439/connection_db}
    username: ${SPRING_DATASOURCE_USERNAME:connection_user}
    password: ${SPRING_DATASOURCE_PASSWORD:connection_pass}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s

    cache:
      type: redis
      redis:
        time-to-live: 10m
        cache-null-values: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9099}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  level:
    root: INFO
    com.linkedinclone.connection: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

connection-service:
  kafka:
    topics:
      connection-request-sent: connection.request.sent
      connection-request-accepted: connection.request.accepted
      connection-request-rejected: connection.request.rejected
      connection-request-cancelled: connection.request.cancelled
      user-blocked: connection.user.blocked
      user-unblocked: connection.user.unblocked
  outbox:
    publisher-delay-ms: 20000

