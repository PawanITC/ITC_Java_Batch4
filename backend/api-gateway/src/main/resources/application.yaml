server:
  port: 8085
  forward-headers-strategy: framework

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/linkedin-app}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/linkedin-app/protocol/openid-connect/certs}


  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - SecureHeaders
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}
                redis-rate-limiter.requestedTokens: 1
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR, SERVICE_UNAVAILABLE
          routes:
            - id: userprofile-service
              uri: ${USERPROFILE_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/profiles/**

            - id: search-discovery-service
              uri: ${SEARCH_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/api/search/**,/api/discovery/**

            - id: trending-service
              uri: ${SEARCH_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/api/trending/**
              filters:
                - RewritePath=/api/trending/(?<segment>.*), /api/discovery/trending/${segment}

            - id: feed-and-timeline-service
              uri: ${FEED_SERVICE_URI:http://localhost:8087}
              predicates:
                - Path=/api/timeline,/api/timeline/**
              filters:
                - RewritePath=/api/timeline$, /api/timeline/

            - id: post-and-timeline-service
              uri: ${POST_SERVICE_URI:http://localhost:8088}
              predicates:
                - Path=/api/posts/**

            - id: jobposting-service
              uri: ${JOBPOSTING_SERVICE_URI:http://localhost:8089}
              predicates:
                - Path=/api/v1/jobs/**

            - id: notification-service-root
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8088}
              predicates:
                - Path=/api/notifications
              filters:
                - RewritePath=/api/notifications, /notifications

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8088}
              predicates:
                - Path=/api/notifications/**
              filters:
                - RewritePath=/api/notifications/(?<segment>.*), /notifications/${segment}
            - id: connections-service
              uri: ${CONNECTIONS_SERVICE_URI:http://localhost:8088}
              predicates:
                - Path=/api/v1/connections/**

app:
  gateway:
    security:
      allowed-origins:
        - ${GATEWAY_ALLOWED_ORIGIN:http://localhost:3000}
      allowed-token-clients:
        - ${GATEWAY_ALLOWED_TOKEN_CLIENT:linkedin-frontend}
        - ${GATEWAY_ADDITIONAL_ALLOWED_TOKEN_CLIENT:api-gateway}
        - api-gateway

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: when_authorized

  metrics:
    tags:
      application: api-gateway

  logging:
    level:
      org.springframework.cloud.gateway: INFO
      org.springframework.security: INFO
      com.itc.linkedin.api_gateway: INFO
