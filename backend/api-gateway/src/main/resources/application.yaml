server:
  port: 8085

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/linkedin-app

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      routes:
        - id: search-discovery-service-route
          uri: http://localhost:8086
          predicates:
            - Path=/api/search/**,/api/discovery/**
          filters:
            - name: CircuitBreaker
              args:
                name: searchDiscoveryCircuitBreaker
                fallbackUri: forward:/fallback/search-discovery

        - id: userprofile-service-route
          uri: ${USERPROFILE_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/profiles/**
          filters:
            - name: CircuitBreaker
              args:
                name: userProfileCircuitBreaker
                fallbackUri: forward:/fallback/profile

            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

            - AddResponseHeader=X-Service-Name, search-discovery-service
            - AddResponseHeader=X-Gateway-Cache-Strategy, redis-cache-for-public-search-results

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway