server:
  port: 8087

spring:
  application:
    name: feed-and-timeline-service

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://host.docker.internal:8080/realms/linkedin-app/protocol/openid-connect/certs

management:
  endpoints:
    web:
      exposure:
        include: health,info