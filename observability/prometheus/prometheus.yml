global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["api-gateway:8085"]

  - job_name: "search-discovery-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["search-discovery-service:8086"]

  - job_name: "feed-and-timeline-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["feed-and-timeline-service:8087"]

  - job_name: "post-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["post-service:8088"]

  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]

