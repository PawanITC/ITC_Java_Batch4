spring.application.name=PremiumSubscription

# Server Configuration
server.port=9000

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/linkedin
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keycloak / OAuth2 Resource Server Configuration
# Replace 'your-realm' and 'localhost:8081' with your actual Keycloak setup
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/linkedin_app
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/linkedin_app/protocol/openid-connect/certs
logging.level.org.springframework.security=DEBUG